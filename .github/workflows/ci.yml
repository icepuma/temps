name: CI
on:
  push:
    branches:
      - "main"
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo fmt -- --check && cargo clippy -- -Dwarnings
      - run: cargo nextest run --all-features

  msrv:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      # `+1.88` on the command line overrides rust-toolchain.toml, which would
      # otherwise pin this job to the stable channel we build with.
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 check --workspace --all-features --all-targets
