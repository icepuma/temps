name: CI
on:
  push:
    branches:
      - "main"
  pull_request:
jobs:
  # Mirrors `just check`: format, lint, test, doc-test, examples.
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo fmt --all -- --check
      # Lint every target (tests, examples) with every feature, so the feature-gated facade
      # modules and the test suites are covered too.
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -Dwarnings
      - run: cargo nextest run --locked --workspace --all-features
      # nextest does not run doctests; this also compiles and runs the README's code blocks,
      # through the unpublished temps-readme-check crate.
      - run: cargo test --doc --locked --workspace --all-features
      - run: cargo run --locked --example chrono_example --features chrono
      - run: cargo run --locked --example jiff_example --features jiff

  msrv:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      # `+1.88` on the command line overrides rust-toolchain.toml, which would
      # otherwise pin this job to the stable channel we build with.
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 check --locked --workspace --all-features --all-targets
