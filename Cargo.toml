# Dependency policy: the member crates declare third-party dependencies as caret requirements,
# never as exact `=` pins. These are published libraries, and an exact pin would force every
# downstream dependency graph onto that one patch release, so resolution fails as soon as
# another crate needs a different one.
#
# Each floor is the OLDEST release the workspace builds and passes its tests with, not the
# newest one, so temps also unifies with graphs that hold an older patch (through an exact pin
# or an upper bound elsewhere). chrono 0.4.34 is the first release with `TimeDelta`; jiff,
# thiserror, chumsky, ariadne and mockall work from the first release of their line. The
# `minimal-versions` CI job resolves every direct dependency to its floor and runs the tests,
# so raise a floor in the same change that starts needing a newer release.
#
# Cargo.lock stays at the newest versions: reproducible builds come from it and `--locked` in
# CI. Only the sibling temps-* crates, which are released together, pin each other with `=`.
[workspace]
members = [
    "temps",
    "temps-core",
    "temps-chrono",
    "temps-jiff",
    "temps-testhelpers",
    "readme-check",
]
resolver = "3"

[workspace.package]
version = "5.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Stefan Ruzitschka <stefan@icepuma.dev>"]
repository = "https://github.com/icepuma/temps"
license = "MIT OR Apache-2.0"
